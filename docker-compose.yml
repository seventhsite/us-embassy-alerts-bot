services:
  bot:
    build:
      context: .
      # Always pull the base image, otherwise BuildKit keeps reusing a cached
      # python:3-slim and Python never moves past the version of the first build
      pull: true
    container_name: usembassy-alerts-bot
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3, os; db=os.getenv('DB_PATH','/data/bot.db'); sqlite3.connect(db).execute('SELECT 1'); print('ok')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
